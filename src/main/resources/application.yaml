fint:
  application-id: fint-flyt-acos-gateway

logging:
  level:
    reactor.netty.http.client: debug

server:
  error:
    include-message: always
  max-http-request-header-size: 40KB

spring:
  profiles:
    include:
      - flyt-kafka
      - flyt-logging
      - flyt-security
      - flyt-file-client
      - flyt-authorization-client
  output:
    ansi:
      enabled: always
